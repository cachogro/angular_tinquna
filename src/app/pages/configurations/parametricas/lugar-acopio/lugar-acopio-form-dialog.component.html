<div class="blue_theme tema-configuracion">
  <app-parametrica-dialog-shell [titulo]="modoEdicion ? 'Modificar Lugar de Acopio' : 'Nuevo Lugar de Acopio'">

    <!-- ==================== FORMULARIO ==================== -->
    <form [formGroup]="form" (ngSubmit)="guardar()" class="lugar-acopio-form">

      <!-- Descripción -->
      <mat-form-field appearance="outline">
        <mat-label>Descripción</mat-label>
        <input matInput formControlName="descripcion" maxlength="100" placeholder="Ej: GALPON"
          class="input-mayusculas" />
        <mat-error *ngIf="form.get('descripcion')?.hasError('required')">
          La descripción es obligatoria
        </mat-error>
        <mat-error *ngIf="form.get('descripcion')?.hasError('minlength')">
          Mínimo 2 caracteres
        </mat-error>
        <mat-error *ngIf="form.get('descripcion')?.hasError('pattern')">
          Solo letras, números, espacios, puntos y guiones
        </mat-error>
      </mat-form-field>

    </form>

    <!-- ==================== BOTONES ==================== -->
    <div class="acciones">
      <button mat-stroked-button type="button" (click)="cancelar()" [disabled]="guardando">
        {{ modoEdicion ? 'Cancelar edición' : 'Limpiar' }}
      </button>
      <button mat-flat-button color="primary" type="button" (click)="guardar()" [disabled]="guardando">
        {{ modoEdicion ? 'Actualizar' : 'Guardar' }}
      </button>
    </div>

    <!-- ==================== TABLA ==================== -->
    <mat-card class="tabla-card">
      <mat-card-title>Lugares de acopio registrados</mat-card-title>

      <mat-card-content>

        <div class="tabla-scroll">
          <table mat-table [dataSource]="lugares" class="tabla mat-elevation-z1">

            <ng-container matColumnDef="id">
              <th mat-header-cell *matHeaderCellDef>ID</th>
              <td mat-cell *matCellDef="let row">{{ row.id }}</td>
            </ng-container>

            <ng-container matColumnDef="descripcion">
              <th mat-header-cell *matHeaderCellDef>Descripción</th>
              <td mat-cell *matCellDef="let row">{{ row.descripcion }}</td>
            </ng-container>

            <ng-container matColumnDef="estado">
              <th mat-header-cell *matHeaderCellDef>Estado</th>
              <td mat-cell *matCellDef="let row">
                <span class="badge" [class.badge--vigente]="row.activo" [class.badge--vencida]="!row.activo">
                  {{ row.activo ? 'Activo' : 'Inactivo' }}
                </span>
              </td>
            </ng-container>

            <ng-container matColumnDef="acciones">
              <th mat-header-cell *matHeaderCellDef>Acciones</th>
              <td mat-cell *matCellDef="let row">
                <button mat-icon-button color="primary" matTooltip="Editar" (click)="editar(row)">
                  <mat-icon>edit</mat-icon>
                </button>

                <button mat-icon-button [color]="row.activo ? 'warn' : 'primary'"
                  [matTooltip]="row.activo ? 'Desactivar' : 'Activar'" (click)="cambiarEstado(row)">
                  <mat-icon>{{ row.activo ? 'toggle_on' : 'toggle_off' }}</mat-icon>
                </button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="columnas"></tr>
            <tr mat-row *matRowDef="let row; columns: columnas"></tr>
          </table>
        </div>

        <p *ngIf="!cargando && lugares.length === 0" class="sin-datos">
          No hay lugares de acopio registrados.
        </p>

      </mat-card-content>
    </mat-card>
  </app-parametrica-dialog-shell>
</div>
