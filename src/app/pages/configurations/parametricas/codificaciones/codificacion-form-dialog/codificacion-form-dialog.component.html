<app-parametrica-dialog-shell
  [titulo]="modoEdicion ? 'Modificar Codificación' : 'Nueva Codificación'"
>
  <form [formGroup]="form" (ngSubmit)="guardar()" class="codificacion-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Código</mat-label>
      <input matInput formControlName="codigo" maxlength="10" placeholder="Ej: BZI" />
      <mat-error *ngIf="form.get('codigo')?.hasError('required')">
        El código es obligatorio
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Minerales</mat-label>
      <mat-select formControlName="minerales" multiple>
        <mat-option *ngFor="let mineral of minerales" [value]="mineral.id">
          {{ mineral.descripcion }} ({{ mineral.simbolo }})
        </mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('minerales')?.hasError('required')">
        Debe seleccionar al menos un mineral
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre (generado automáticamente)</mat-label>
      <input matInput formControlName="nombre" readonly />
    </mat-form-field>
  </form>

  <ng-container dialog-actions>
    <button mat-stroked-button type="button" (click)="cancelar()" [disabled]="guardando">
      Cancelar
    </button>
    <button
      mat-flat-button
      color="primary"
      type="button"
      (click)="guardar()"
      [disabled]="guardando"
    >
      {{ modoEdicion ? 'Actualizar' : 'Guardar' }}
    </button>
  </ng-container>
</app-parametrica-dialog-shell>
