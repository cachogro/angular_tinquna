<div class="blue_theme ">

  <app-parametrica-dialog-shell [titulo]="modoEdicion ? 'Modificar Codificación' : 'Nueva Codificación'">

    <!-- ==================== FORMULARIO ==================== -->

    <form [formGroup]="form" (ngSubmit)="guardar()" class="codificacion-form">

      <!-- Código -->

      <mat-form-field appearance="outline">
        <mat-label>Código</mat-label>

        <input matInput formControlName="codigo" maxlength="10" placeholder="Ej: BZI" />

        <mat-error *ngIf="form.get('codigo')?.hasError('required')">
          El código es obligatorio
        </mat-error>

      </mat-form-field>

      <!-- Minerales -->

      <mat-form-field appearance="outline">

        <mat-label>Minerales</mat-label>

        <mat-select formControlName="minerales" multiple>

          <mat-option *ngFor="let mineral of minerales" [value]="mineral.id">

            {{ mineral.descripcion }}
            ({{ mineral.simbolo }})

          </mat-option>

        </mat-select>

        <mat-error *ngIf="form.get('minerales')?.hasError('required')">
          Debe seleccionar al menos un mineral
        </mat-error>

      </mat-form-field>

      <!-- Nombre -->

      <mat-form-field appearance="outline">

        <mat-label>Nombre (Generado automáticamente)</mat-label>

        <input matInput formControlName="nombre" readonly />

      </mat-form-field>

    </form>

    <!-- ==================== BOTONES ==================== -->

    <div class="acciones">
      <button mat-stroked-button type="button" (click)="cancelar()" [disabled]="guardando">
        {{ modoEdicion ? 'Cancelar edición' : 'Limpiar' }}
      </button>
      <button mat-flat-button color="primary" type="button" (click)="guardar()" [disabled]="guardando">
        {{ modoEdicion ? 'Actualizar' : 'Guardar' }}
      </button>
    </div>

    <!-- ==================== TABLA ==================== -->
    <mat-card class="tabla-card">
      <mat-card-title>
        Codificaciones registradas
      </mat-card-title>

      <mat-card-content>
        <div class="tabla-scroll">
          <table mat-table [dataSource]="codificaciones" class="tabla mat-elevation-z1">
            <!-- ID -->
            <ng-container matColumnDef="id">
              <th mat-header-cell *matHeaderCellDef>
                ID
              </th>
              <td mat-cell *matCellDef="let row">
                {{ row.id }}
              </td>
            </ng-container>
            <!-- Código -->
            <ng-container matColumnDef="codigo">
              <th mat-header-cell *matHeaderCellDef>
                Código
              </th>
              <td mat-cell *matCellDef="let row">
                {{ row.codigo }}
              </td>
            </ng-container>
            <!-- Nombre -->
            <ng-container matColumnDef="nombre">
              <th mat-header-cell *matHeaderCellDef>
                Nombre
              </th>
              <td mat-cell *matCellDef="let row">
                {{ row.nombre }}
              </td>
            </ng-container>
            <!-- Acciones -->
            <ng-container matColumnDef="acciones">
              <th mat-header-cell *matHeaderCellDef>
                Acciones
              </th>
              <td mat-cell *matCellDef="let row">
                <button mat-icon-button color="primary" matTooltip="Editar" (click)="editar(row)">
                  <mat-icon>edit</mat-icon>
                </button>
              </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="columnas"></tr>
            <tr mat-row *matRowDef="let row; columns: columnas"></tr>
          </table>
        </div>
        <p *ngIf="!cargando && codificaciones.length === 0" class="sin-datos">
          No hay codificaciones registradas.
        </p>
      </mat-card-content>
    </mat-card>
  </app-parametrica-dialog-shell>
</div>
